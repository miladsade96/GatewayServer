spring:
  application:
    name: "gatewayserver"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 5000ms
  config:
    import: "optional:configserver:http://localhost:8071"

  rabbitmq:
    host: "localhost"
    port: "5672"
    username: "guest"
    password: "guest"

  data:
    redis:
      connect-timeout: 2s
      host: "redis"
      port: 6379
      timeout: 1s

info:
  app:
    name: "gatewayserver"
    description: "Microservices API Gateway Server"
    version: "1.0.0"

logging:
  level:
    tech:
      miladsadeghi:
        gatewayserver: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state:
          seconds: 10
